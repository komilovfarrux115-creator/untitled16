name: untitled16
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1


environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  # Cupertino icons for iOS-style widgets
  cupertino_icons: ^1.0.8

  # Animations and UI
  lottie: ^3.3.2
  toast: ^0.3.0
  fluttertoast: ^9.0.0

  # URL launcher
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.4
  flutter_secure_storage: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/animal_icon.png      # App icon
    - assets/animals/             # Hayvon rasmlari
    - assets/fruits/              # Mevalar rasmlari
    - assets/                     # Boshqa umumiy assetslar

flutter_icons:
  android: true
  ios: true
  image_path: "assets/animal_icon.png"
  adaptive_icon_background: #ffffff
  min_sdk_android: 21
